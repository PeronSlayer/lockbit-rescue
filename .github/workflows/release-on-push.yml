name: Release On Push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KEEP_AUTO_PRERELEASES: 10

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Compute release version
        id: version
        run: |
          VERSION="auto-${{ github.run_number }}-${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    needs: [prepare-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev-i386 file git

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build release bundle
        id: bundle
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          OUT=$(bash scripts/build_release_bundle.sh "${VERSION}")
          echo "$OUT"
          echo "tarball=dist/lockbit-rescue-${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: ${{ steps.bundle.outputs.tarball }}

  build-windows:
    runs-on: windows-latest
    needs: [prepare-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wizard executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onefile --name lockbit-wizard lockbit-wizard.py

      - name: Create Windows package
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-version.outputs.version }}"
          $pkgDir = "dist/lockbit-rescue-windows-$version"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item "dist/lockbit-wizard.exe" "$pkgDir/lockbit-wizard.exe"
          Copy-Item "lockbit-wizard.py" "$pkgDir/lockbit-wizard.py"
          Copy-Item "lockbit-wizard.cmd" "$pkgDir/lockbit-wizard.cmd"
          Copy-Item "lockbit-rescue.py" "$pkgDir/lockbit-rescue.py"
          Copy-Item "lockbit-extend.py" "$pkgDir/lockbit-extend.py"
          Copy-Item "verify-recovered.py" "$pkgDir/verify-recovered.py"
          Copy-Item "manifest.py" "$pkgDir/manifest.py"
          Copy-Item "keystream_cache.py" "$pkgDir/keystream_cache.py"
          Copy-Item "phase2.py" "$pkgDir/phase2.py"
          Copy-Item "output_layout.py" "$pkgDir/output_layout.py"
          Copy-Item "report_utils.py" "$pkgDir/report_utils.py"
          Copy-Item "README.md" "$pkgDir/README.md"
          Copy-Item "LICENSE" "$pkgDir/LICENSE"
          Copy-Item "CHANGELOG.md" "$pkgDir/CHANGELOG.md"
          Copy-Item "requirements.txt" "$pkgDir/requirements.txt"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "dist/lockbit-rescue-windows-$version.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/lockbit-rescue-windows-${{ needs.prepare-version.outputs.version }}.zip

      - name: Upload wizard executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/lockbit-wizard.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [prepare-version, build-linux, build-windows]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          tars=(release-assets/**/*.tar.gz)
          zips=(release-assets/**/*.zip)
          exes=(release-assets/**/*.exe)

          echo "Found tarballs: ${#tars[@]}"
          echo "Found zips: ${#zips[@]}"
          echo "Found exes: ${#exes[@]}"

          if [[ ${#tars[@]} -lt 1 ]]; then
            echo "[ERROR] Missing Linux .tar.gz release asset"
            exit 1
          fi
          if [[ ${#zips[@]} -lt 1 ]]; then
            echo "[ERROR] Missing Windows .zip release asset"
            exit 1
          fi
          if [[ ${#exes[@]} -lt 1 ]]; then
            echo "[ERROR] Missing standalone Windows .exe release asset"
            exit 1
          fi

      - name: Remove existing auto release for tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare-version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.version }}
          name: Automated Release ${{ needs.prepare-version.outputs.version }}
          body: |
            Automated build+release from commit `${{ github.sha }}`.

            - Workflow: `${{ github.workflow }}`
            - Run number: `${{ github.run_number }}`
            - Trigger: push to `main`
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.zip
            release-assets/**/*.exe

      - name: Cleanup old auto prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          KEEP="${KEEP_AUTO_PRERELEASES}"
          mapfile -t TAGS < <(
            gh release list \
              --limit 100 \
              --json tagName,isPrerelease,createdAt \
              --jq '.[] | select(.isPrerelease == true and (.tagName | startswith("auto-"))) | .tagName'
          )

          TOTAL="${#TAGS[@]}"
          echo "Auto prereleases found: ${TOTAL} (keep newest ${KEEP})"
          if (( TOTAL <= KEEP )); then
            exit 0
          fi

          for i in "${!TAGS[@]}"; do
            if (( i >= KEEP )); then
              tag="${TAGS[$i]}"
              echo "Deleting old auto prerelease: ${tag}"
              gh release delete "${tag}" --yes --cleanup-tag
            fi
          done
