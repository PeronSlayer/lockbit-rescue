name: Release On Push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KEEP_AUTOMATED_RELEASES: 10

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}

    steps:
      - name: Compute release version
        id: version
        run: |
          RELEASE_DATE="$(date -u +%Y.%m.%d)"
          VERSION="${RELEASE_DATE}-${{ github.run_number }}"
          TAG="release-${VERSION}"
          TITLE="LockBit Rescue ${RELEASE_DATE} build ${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    needs: [prepare-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev-i386 file git

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build release bundle
        id: bundle
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          OUT=$(bash scripts/build_release_bundle.sh "${VERSION}")
          echo "$OUT"
          echo "tarball=dist/lockbit-rescue-${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: ${{ steps.bundle.outputs.tarball }}

  build-windows:
    runs-on: windows-latest
    needs: [prepare-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wizard executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onefile --name lockbit-wizard lockbit-wizard.py

      - name: Create Windows package
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-version.outputs.version }}"
          $pkgDir = "dist/lockbit-rescue-windows-$version"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item "dist/lockbit-wizard.exe" "$pkgDir/lockbit-wizard.exe"
          Copy-Item "lockbit-wizard.py" "$pkgDir/lockbit-wizard.py"
          Copy-Item "lockbit-wizard.cmd" "$pkgDir/lockbit-wizard.cmd"
          Copy-Item "lockbit-rescue.py" "$pkgDir/lockbit-rescue.py"
          Copy-Item "lockbit-extend.py" "$pkgDir/lockbit-extend.py"
          Copy-Item "verify-recovered.py" "$pkgDir/verify-recovered.py"
          Copy-Item "manifest.py" "$pkgDir/manifest.py"
          Copy-Item "keystream_cache.py" "$pkgDir/keystream_cache.py"
          Copy-Item "phase2.py" "$pkgDir/phase2.py"
          Copy-Item "output_layout.py" "$pkgDir/output_layout.py"
          Copy-Item "report_utils.py" "$pkgDir/report_utils.py"
          Copy-Item "README.md" "$pkgDir/README.md"
          Copy-Item "LICENSE" "$pkgDir/LICENSE"
          Copy-Item "CHANGELOG.md" "$pkgDir/CHANGELOG.md"
          Copy-Item "requirements.txt" "$pkgDir/requirements.txt"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "dist/lockbit-rescue-windows-$version.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/lockbit-rescue-windows-${{ needs.prepare-version.outputs.version }}.zip

      - name: Upload wizard executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/lockbit-wizard.exe

  publish-release:
    runs-on: ubuntu-latest
    needs: [prepare-version, build-linux, build-windows]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          tars=(release-assets/**/*.tar.gz)
          zips=(release-assets/**/*.zip)
          exes=(release-assets/**/*.exe)

          echo "Found tarballs: ${#tars[@]}"
          echo "Found zips: ${#zips[@]}"
          echo "Found exes: ${#exes[@]}"

          if [[ ${#tars[@]} -lt 1 ]]; then
            echo "[ERROR] Missing Linux .tar.gz release asset"
            exit 1
          fi
          if [[ ${#zips[@]} -lt 1 ]]; then
            echo "[ERROR] Missing Windows .zip release asset"
            exit 1
          fi
          if [[ ${#exes[@]} -lt 1 ]]; then
            echo "[ERROR] Missing standalone Windows .exe release asset"
            exit 1
          fi

      - name: Remove existing automated release for tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare-version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: ${{ needs.prepare-version.outputs.title }}
          body: |
            Full automated release from commit `${{ github.sha }}`.

            - Workflow: `${{ github.workflow }}`
            - Run number: `${{ github.run_number }}`
            - Trigger: push to `main`
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.zip
            release-assets/**/*.exe

      - name: Force full release status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh release view "${{ needs.prepare-version.outputs.tag }}" --json databaseId --jq '.databaseId')"
          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -f name="${{ needs.prepare-version.outputs.title }}" \
            -F prerelease=false \
            -F draft=false \
            -F make_latest=true

      - name: Cleanup legacy auto releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t LEGACY_TAGS < <(
            gh release list \
              --limit 100 \
              --json tagName \
              --jq '.[] | select(.tagName | startswith("auto-")) | .tagName'
          )

          for tag in "${LEGACY_TAGS[@]}"; do
            echo "Deleting legacy auto release: ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag
          done

      - name: Cleanup old automated releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          KEEP="${KEEP_AUTOMATED_RELEASES}"
          mapfile -t TAGS < <(
            gh release list \
              --limit 100 \
              --json tagName,createdAt \
              --jq '.[] | select(.tagName | startswith("release-")) | .tagName'
          )

          TOTAL="${#TAGS[@]}"
          echo "Automated releases found: ${TOTAL} (keep newest ${KEEP})"
          if (( TOTAL <= KEEP )); then
            exit 0
          fi

          for i in "${!TAGS[@]}"; do
            if (( i >= KEEP )); then
              tag="${TAGS[$i]}"
              echo "Deleting old automated release: ${tag}"
              gh release delete "${tag}" --yes --cleanup-tag
            fi
          done
