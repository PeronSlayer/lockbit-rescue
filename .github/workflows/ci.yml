name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install actionlint
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v1.7.1/actionlint_1.7.1_linux_amd64.tar.gz" \
            | tar -xz
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Run Python lint (ruff)
        run: |
          ruff check .

      - name: Validate GitHub workflows
        run: |
          actionlint

      - name: Validate shell scripts
        run: |
          shellcheck install.sh scripts/build_release_bundle.sh

  test:
    runs-on: ubuntu-latest
    needs: [lint-and-validate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: |
          python -m py_compile lockbit-rescue.py lockbit-extend.py lockbit-wizard.py verify-recovered.py manifest.py keystream_cache.py phase2.py output_layout.py report_utils.py runtime_profiles.py lockbit_rescue_bench.py scripts/benchmark_scan.py

      - name: Run tests
        run: |
          pytest -q
