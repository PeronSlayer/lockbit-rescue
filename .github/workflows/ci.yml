name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile check
        run: |
          python -m py_compile lockbit-rescue.py lockbit-extend.py lockbit-wizard.py verify-recovered.py manifest.py keystream_cache.py phase2.py output_layout.py report_utils.py

      - name: Run tests
        run: |
          pytest -q
